# Relevé quotidien des votes « Cette page t'a aidé ? » (compteurs Abacus Oui/Non par commande)
# → votes.json sur la branche uptime, en préservant uptime.json et growth.json.
name: Votes de la doc
on:
  schedule:
    - cron: '47 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer l'état précédent de la branche uptime (uptime + growth à préserver)
        run: |
          git fetch origin uptime || true
          git show origin/uptime:uptime.json > uptime.json 2>/dev/null || echo '{"hours":[]}' > uptime.json
          git show origin/uptime:growth.json > growth.json 2>/dev/null || echo '{"points":[]}' > growth.json
      - name: Relever les compteurs de votes
        run: node .github/build-votes.js
      - name: Publier sur la branche uptime
        run: |
          git config user.name "uptime-bot"
          git config user.email "actions@github.com"
          git switch --orphan uptime2
          git add uptime.json growth.json votes.json
          git commit -m "votes $(date -u +%Y-%m-%d)"
          git branch -M uptime2 uptime
          git push -f origin uptime
